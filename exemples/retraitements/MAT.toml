# Ajustements d'analyste pour Mattel (MAT). Montants en millions de dollars.
# C'est ici que se prennent les décisions de retraitement : modifie, ajoute ou
# supprime des lignes, puis relance Talanton.

[capex]
# Mattel présente ses investissements sur deux lignes du tableau de flux :
# « Purchases of tools, dies, and molds » et « Purchases of other property,
# plant, and equipment ». La première porte une balise propre à Mattel, absente
# de l'API companyfacts de la SEC, qui ne renvoie donc qu'une partie du capex.
# Total reconstitué à partir du flux d'investissement publié, et recoupé avec
# stockanalysis.com (ligne « Capital Expenditures »).
source = "10-K Mattel, tableau de flux (deux lignes d'investissement) ; recoupé avec stockanalysis.com"
"2021-12-31" = 151.353
"2022-12-31" = 186.503
"2023-12-31" = 160.300
"2024-12-31" = 202.620
"2025-12-31" = 181.992

[ebitda]
# Le résultat opérationnel du T3 2026 inclut 88 M$ de remboursements de droits
# de douane, que Mattel exclut lui-même de ses prévisions. Produit non récurrent :
# on le retire de l'EBITDA des douze derniers mois.
source = "Communiqué de résultats du T3 2026 (8-K du 5 novembre 2026) : 88 M$ de remboursements de droits de douane"
"LTM" = -88.0

[resultat_net]
# Deux produits non récurrents gonflent le résultat net des douze derniers mois :
#   - 147,9 M$ de plus-value comptable sur le rachat des 50 % restants de Mattel163
#     (hypothèse : plus-value non imposée) ;
#   - les 88 M$ de remboursements de droits de douane, soit 66 M$ après impôt à 25 %.
# Cet ajustement ne sert qu'au PER appliqué à Mattel dans l'onglet Comparables.
source = "Communiqué de résultats du T3 2026 : plus-value Mattel163 (147,9 M$) et remboursements de droits de douane (88 M$, soit 66 M$ après impôt à 25 %)"
"LTM" = -213.9
