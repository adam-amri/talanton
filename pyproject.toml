[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The name "talanton" is already taken on PyPI by another project:
# the package is distributed as "talanton-valo", the import stays `talanton`.
name = "talanton-valo"
version = "0.2.0"
description = "From a ticker to an M&A / LBO valuation model in Excel, with live formulas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "requests>=2.31"]

[project.optional-dependencies]
market = ["yfinance>=0.2.40"]
app = ["streamlit>=1.50", "plotly>=5.20", "pandas>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
talanton = "talanton.cli:main"

[tool.setuptools.packages.find]
include = ["talanton*"]

[tool.setuptools.package-data]
talanton = ["data/reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
